services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: ms-backend
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - ./chroma_db:/app/chroma_db
      # 复用宿主已下载的 ChromaDB embedding 模型缓存，避免容器内重新下载
      - ${USERPROFILE}/.cache/chroma:/root/.cache/chroma
      # 会话持久化（历史聊天记录），与宿主共享
      - ./.memory:/app/.memory
      # 源码热重载：改 Python 代码无需重建镜像
      - ./backend:/app/backend
      - ./mini_smolagents:/app/mini_smolagents
    command: uvicorn backend.main:app --host 0.0.0.0 --port 8000 --reload
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ms-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped
